name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/core/**' # reference pages are generated from core
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Publishing to the gh-pages branch needs write access to repo contents.
permissions:
  contents: write

# One in-flight deploy at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # astro.config.mjs defaults to the project-site base (/alpona); override
      # here if the repo or owner changes.
      - run: pnpm --filter @alpona/website build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          # peaceiris adds .nojekyll automatically (enable_jekyll defaults false)
