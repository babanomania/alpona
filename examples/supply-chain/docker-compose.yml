services:
  postgres:
    image: postgres:16-alpine
    container_name: alpona-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: alpona
      POSTGRES_PASSWORD: alpona
      POSTGRES_DB: alpona
    volumes:
      - alpona-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alpona -d alpona']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  alpona-pgdata:
